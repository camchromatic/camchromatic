
media:
  input: media
  output: /media

content:
  - name: posts
    label: Art Posts
    type: collection
    path: content/posts
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: images
        label: Images
        type: image
        required: true
        options:
          multiple:
            max: 10
          unique: true
      - name: caption
        label: Caption
        type: text
