
media:
  input: media
  output: /media

content:
  - name: posts
    label: Art Posts
    type: collection
    path: content/posts
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Post Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: image
        label: Artwork
        type: image
      - name: caption
        label: Caption
        type: text
      - name: category
        label: Category
        type: string
