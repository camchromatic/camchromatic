media:
  input: media
  output: /media
  categories: [image]

content:
  - name: posts
    label: Art Posts
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    format: yaml-frontmatter
    fields:
      - name: images
        label: Images
        type: image
        required: true
        options:
          multiple:
            max: 10
          unique: true
      - name: caption
        label: Caption
        type: text

  - name: blog
    label: Blog Entries
    type: collection
    path: content/blog
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: cover
        label: Cover Image
        type: image
      - name: body
        label: Entry
        type: rich-text
        options:
          format: markdown

  - name: updates
    label: Site Updates
    type: collection
    path: content/updates
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: text
        label: "Text (BBCode works: [b] [i] [u] [s] [color=red] [url=projects.html]...[/url])"
        type: text
      - name: link
        label: Link (optional, e.g. projects.html or a full web address)
        type: string
