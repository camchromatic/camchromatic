media:
  input: media
  output: /media
  categories: [image]

content:
  - name: posts
    label: Art Posts
    type: collection
    path: content/posts
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: images
        label: Images
        type: image
        required: true
        options:
          multiple:
            max: 10
          unique: true
      - name: caption
        label: Caption
        type: text

  - name: blog
    label: Blog Entries
    type: collection
    path: content/blog
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: cover
        label: Cover Image
        type: image
      - name: cover_zoom
        label: Cover Preview Zoom (1–3; 1 = no zoom)
        type: number
        options:
          min: 1
          max: 3
      - name: cover_x
        label: Cover Preview Horizontal Position (0 = left, 50 = center, 100 = right)
        type: number
        options:
          min: 0
          max: 100
      - name: cover_y
        label: Cover Preview Vertical Position (0 = top, 50 = center, 100 = bottom)
        type: number
        options:
          min: 0
          max: 100
      - name: body
        label: Entry
        type: rich-text
        options:
          format: markdown
          media: default
