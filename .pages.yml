media:
  input: media
  output: /media
  categories: [image, video]

content:
  - name: posts
    label: Art Posts
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    format: yaml-frontmatter
    fields:
      - name: images
        label: Images
        type: image
        required: true
        options:
          multiple:
            max: 10
          unique: true
      - name: caption
        label: Caption
        type: text

  - name: blog
    label: Blog Entries
    type: collection
    path: content/blog
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: cover
        label: Cover Image
        type: image
      - name: body
        label: Entry
        type: rich-text
        options:
          format: markdown

  - name: updates
    label: Site Updates
    type: collection
    path: content/updates
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: text
        label: "Text (BBCode works: [b] [i] [u] [s] [color=red] [url=projects.html]...[/url])"
        type: text
      - name: link
        label: Link (optional, e.g. projects.html or a full web address)
        type: string

  - name: doodles
    label: Doodles
    type: file
    path: content/doodles.yml
    format: yaml
    fields:
      - name: hidden
        label: Hidden doodles (every other doodle shows on the Doodles page)
        type: image
        options:
          multiple:
            max: 500
          path: media/doodles

  - name: home
    label: Home Banner
    type: file
    path: content/home.yml
    format: yaml
    fields:
      - name: banner
        label: "Banner picture (best 3 times wider than tall, e.g. 1500x500; other shapes get cropped)"
        type: image
      - name: alt
        label: Short description of the picture (for people who can't see it)
        type: string

  - name: about
    label: About Page
    type: file
    path: content/about.yml
    format: yaml
    fields:
      - name: photo
        label: Photo
        type: image
      - name: eyebrow
        label: Small line above your name
        type: string
      - name: name
        label: Name
        type: string
      - name: text
        label: "Text (leave an empty line between paragraphs; BBCode works: [b] [i] [u] [s] [color=red] [url=contact.html]...[/url])"
        type: text

  - name: projects
    label: Projects Page
    type: file
    path: content/projects.yml
    format: yaml
    fields:
      - name: intro
        label: "Intro text under the Projects heading (BBCode works: [b] [i] [url=about.html]...[/url])"
        type: text
      - name: projects
        label: Project cards (shown in this order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Name
            type: string
            required: true
          - name: kind
            label: Small line above the name (e.g. Free Tool, Work in progress)
            type: string
          - name: description
            label: Description
            type: text
          - name: link
            label: Link (e.g. palette-lab.html or a full web address; leave empty for no link)
            type: string
          - name: image
            label: Picture (leave empty for a rainbow "Coming soon" box)
            type: image
            options:
              path: media/projects
