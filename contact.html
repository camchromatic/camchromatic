<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact · CamChromatic</title>
<style>

:root{--bg:#1c1f20;--panel:#191b1c;--ink:#e8e2d8;--muted:#b8aa98;--line:#514536;--accent:#2785ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1160px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line)}
.top{height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:1.25rem;font-weight:500;letter-spacing:-.04em;text-decoration:none;display:flex;gap:0}
nav{display:flex;gap:22px;font-size:.9rem}a{color:var(--accent);text-decoration:none}
.hero{padding:44px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;color:var(--muted);font-weight:700}
h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.06em;margin:10px 0 12px}
.intro{color:var(--muted);max-width:540px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}
.pill{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 13px;color:var(--muted);cursor:pointer}
.pill.active{background:#191b1c;color:white;border-color:#92816b}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.art-card{padding:0;border:0;text-align:left;background:var(--panel);color:var(--ink);cursor:pointer;min-width:0;border-radius:10px;overflow:hidden}
.art-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#39332a}
.art-meta{padding:10px 12px 13px}.art-title{font-weight:650;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-date{font-size:.78rem;color:var(--muted)}.empty{grid-column:1/-1;padding:52px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.status{font-size:.84rem;color:var(--muted);margin:12px 0 18px}
footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 0 36px;color:var(--muted);font-size:.85rem}
.overlay{position:fixed;inset:0;background:#080808d9;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.open{display:flex}
.post-view{background:var(--bg);width:min(940px,100%);max-height:92vh;overflow:auto;border-radius:14px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);position:relative}
.post-view img{width:100%;height:100%;max-height:82vh;object-fit:contain;background:#181818}.post-copy{padding:32px 26px}
.close{position:absolute;right:12px;top:10px;border:0;background:#eee;color:#222;border-radius:99px;width:36px;height:36px;font-size:1.3rem;cursor:pointer}
.post-copy h2{margin:0 0 4px;font-size:1.5rem}.post-copy .date{font-size:.8rem;color:var(--muted)}
.caption{white-space:pre-wrap;margin-top:22px}.tags{color:var(--muted);font-size:.85rem;margin-top:18px}
@media(max-width:700px){.wrap{padding:0 14px}.hero{padding:34px 0 22px}.grid{gap:8px}.art-meta{padding:8px}.art-title{font-size:.88rem}.post-view{display:block}.post-view img{height:auto;max-height:60vh}.post-copy{padding:22px}}


.page-content{max-width:760px;padding:48px 24px 24px;min-height:55vh}
.page-content .hero{padding:0}
.page-content h1{margin-top:10px}
.page-content p{max-width:680px;color:var(--muted);line-height:1.8}
.page-content .lead{font-size:1.08rem}
.contact-form{display:grid;gap:16px;margin-top:26px;max-width:620px}
.contact-form label{display:grid;gap:7px;color:var(--ink);font-weight:600}
.contact-form input,.contact-form textarea{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:12px;font:inherit}
.contact-form textarea{min-height:170px;resize:vertical}
.contact-form button{justify-self:start;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);padding:10px 18px;font:inherit;cursor:pointer}
.contact-form .form-note{font-size:.88rem;color:var(--muted);margin:0}
@media(max-width:700px){.page-content{padding:34px 14px 24px}}
header .wrap{padding-left:20px}

</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="index.html" aria-label="CamChromatic home"><span style="color:#cc6873">c</span><span style="color:#d9765a">a</span><span style="color:#d9964d">m</span><span style="color:#cbae4e">c</span><span style="color:#b1bf5c">h</span><span style="color:#8cb866">r</span><span style="color:#6ebd94">o</span><span style="color:#6acac5">m</span><span style="color:#569ac8">a</span><span style="color:#7096c8">t</span><span style="color:#9970c1">i</span><span style="color:#c46ea8">c</span></a><nav><a href="index.html">Gallery</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<main class="wrap page-content">
<section class="hero">
<div class="eyebrow">Get in touch</div>
<h1>Contact</h1>
<p class="lead">For questions about my work, commissions, or collaborations, send me a message using the form below.</p>
<form class="contact-form" action="https://formsubmit.co/camchromatic+portfolio@gmail.com" method="POST">
<input type="hidden" name="_subject" value="New message for Cam's Portfolio">
<input type="hidden" name="_template" value="table">
<label for="contact-name">Name
<input id="contact-name" name="name" type="text" autocomplete="name" required>
</label>
<label for="contact-email">Email address
<input id="contact-email" name="email" type="email" autocomplete="email" required>
</label>
<label for="contact-message">Message
<textarea id="contact-message" name="message" required></textarea>
</label>
<button type="submit">Send message</button>
<p class="form-note">Your name, a valid email address, and a message are all required.</p>
</form>
</section>
</main>
<footer><div class="wrap">© 2020-<span id="year"></span> CamChromatic · Webside code made with minimal AI assistance.</div></footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
