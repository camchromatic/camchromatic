eyebrow: The Color Theorist
name: Cam Garcia
text: >-
  I’m Cam, a 31-year-old south Florida-based Hispanic American creative mind. I
  like to draw characters doing things in sci-fi settings, but I spend most of
  my time making simple jewelry nowadays. Sometimes I play tabletop or video
  games. I enjoy color, psychology, and color theory.


  I have recently made the switch from my passive hobbies to focusing on active
  hobbies. I hope you’ll find use in the tools I’ve made.


  If you’d like to ask about a piece, a project, or potential collaboration, you
  can [url=contact.html]get in touch[/url].
