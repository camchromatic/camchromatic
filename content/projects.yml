intro: I'm an artist, not a programmer, so I used Claude to help code my tools,
  but I decide what they do and how they look, and I test them myself. They run
  on your computer, so your files are never uploaded. Some tools, such as the
  recolor.me Profile Editor, load public pictures from other sites.
projects:
  - title: recolor.me Profile Editor
    kind: Free Tool
    description: Write supported BBCode and see your recolor.me profile bio live,
      with your real avatar and name. Focuses on non-scrolling creations.
      Compliant with https://recolor.me/fair_use.
    link: recolor-profile-editor/
    image: /media/projects/recolor-profile-editor-2026-11-15.png
  - title: Font Sheet
    kind: Free Tool
    description: Drop in a font file and get a sheet that shows it off. Made mostly
      for fun, with a focus on pangram variations, spacing, and repetition
      options.
    link: font-sheet/
    image: /media/projects/font-sheet-2026-11-05b.png
  - title: Swatch Page Maker
    kind: Free Tool
    description: Swatch pages for (most of) your favorite traditional art supplies
      (Excel or PDF).
    link: swatch-page-maker/
    image: /media/projects/swatch-page-maker-2026-11-05.png
  - title: Palette Lab
    kind: Free Tool
    description: Build, tweak, and save color palettes. Made primarily for Procreate
      swatch editing on desktop.
    link: /palette-lab
    image: /media/projects/palette-lab-2026-11-05c.png
  - title: HEXACHROMAGON
    kind: Game ???
    description: An autobattler-ish thing based on color theory. Futuristic Sci-Fi
      story setting with many of my characters. Possible avatar customization.
      Full details TBA. All character art is drawn by me!
