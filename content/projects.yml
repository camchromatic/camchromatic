intro: Some things I'm working on. Every drawing here is mine, made by hand. I'm
  an artist, not a programmer, so I used AI (Claude) to help code my tools, but
  I decide what they do and how they look, and I test them myself. They run on
  your computer, so your files are never uploaded.
projects:
  - title: Font Sheet
    kind: Free Tool
    description: Drop in a font file and get a card that shows it off. Your font
      never leaves your computer.
    link: font-sheet/
    image: /media/projects/font-sheet-2026-11-05b.png
  - title: Swatch Page Maker
    kind: Free Tool
    description: Print-ready swatch sheets for your art supplies (Excel or PDF).
    link: swatch-page-maker/
    image: /media/projects/swatch-page-maker-2026-11-05.png
  - title: Palette Lab
    kind: Free Tool
    description: Build, tweak, and save color palettes. Made primarily for Procreate
      swatch editing on desktop.
    link: palette-lab.html
    image: /media/projects/palette-lab-2026-11-05c.png
  - title: HEXACHROMAGON
    kind: Browser Game
    description: An autobattler based on color theory. Futuristic Sci-Fi story
      setting with many characters. Possible avatar customization. Full details
      TBA. All HEXA art is drawn by me.
