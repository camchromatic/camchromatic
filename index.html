<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art by Cam Garcia</title>
<style>
:root{--bg:#232628;--panel:#191b1c;--ink:#e8e2d8;--muted:#b8aa98;--line:#514536;--accent:#2785ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1160px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line)}
.top{height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:1.25rem;font-weight:500;letter-spacing:-.04em;text-decoration:none;display:flex;gap:0}
nav{display:flex;gap:22px;font-size:.9rem}a{color:var(--accent);text-decoration:none}
.hero{padding:44px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;color:var(--muted);font-weight:700}
h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.06em;margin:10px 0 12px}
.intro{color:var(--muted);max-width:540px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}
.pill{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 13px;color:var(--muted);cursor:pointer}
.pill.active{background:#191b1c;color:white;border-color:#92816b}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.art-card{padding:0;border:0;text-align:left;background:var(--panel);color:var(--ink);cursor:pointer;min-width:0;border-radius:10px;overflow:hidden}
.art-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#39332a}
.art-meta{padding:10px 12px 13px}.art-title{font-weight:650;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-date{font-size:.78rem;color:var(--muted)}.empty{grid-column:1/-1;padding:52px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.status{font-size:.84rem;color:var(--muted);margin:12px 0 18px}
footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 0 36px;color:var(--muted);font-size:.85rem}
.overlay{position:fixed;inset:0;background:#080808d9;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.open{display:flex}
.post-view{background:var(--bg);width:min(940px,100%);max-height:92vh;overflow:auto;border-radius:14px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);position:relative}
.post-view img{width:100%;height:100%;max-height:82vh;object-fit:contain;background:#181818}.post-copy{padding:32px 26px}
.close{position:absolute;right:12px;top:10px;border:0;background:#eee;color:#222;border-radius:99px;width:36px;height:36px;font-size:1.3rem;cursor:pointer}
.post-copy h2{margin:0 0 4px;font-size:1.5rem}.post-copy .date{font-size:.8rem;color:var(--muted)}
.caption{white-space:pre-wrap;margin-top:22px}.tags{color:var(--muted);font-size:.85rem;margin-top:18px}
@media(max-width:700px){.wrap{padding:0 14px}.hero{padding:34px 0 22px}.grid{gap:8px}.art-meta{padding:8px}.art-title{font-size:.88rem}.post-view{display:block}.post-view img{height:auto;max-height:60vh}.post-copy{padding:22px}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="#" aria-label="CamChromatic home"><span style="color:#C85D69">c</span><span style="color:#D66D4F">a</span><span style="color:#D68C3D">m</span><span style="color:#C5A53B">c</span><span style="color:#A9B84A">h</span><span style="color:#78A94E">r</span><span style="color:#479D70">o</span><span style="color:#399F9A">m</span><span style="color:#448FC2">a</span><span style="color:#6878C5">t</span><span style="color:#9266BD">i</span><span style="color:#C064A2">c</span></a><nav><a href="#gallery">Gallery</a><a href="#about">About</a></nav></div></header>
<main class="wrap">
<section class="hero" id="about"><div class="eyebrow">Digital & Traditional · Characters & Explorations · Jewellery & Crafts</div><h1>Creations by Cam Garcia</h1><p class="intro">Available for hire.</p></section>
<div class="filters"><button class="pill active" data-filter="all">All work</button><button class="pill" data-filter="character">Art</button><button class="pill" data-filter="sketch">Craft</button><button class="pill" data-filter="other">Other</button></div>
<div class="status" id="status" aria-live="polite">Loading artwork…</div><section class="grid" id="gallery" aria-label="Art gallery"></section>
</main><footer><div class="wrap">© 2020-<span id="year"></span> CamChromatic · Webside code made with minimal AI assistance.</div></footer>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Artwork details"><article class="post-view"><button class="close" id="close" aria-label="Close post">×</button><img id="viewImage" alt=""><div class="post-copy"><h2 id="viewTitle"></h2><div class="date" id="viewDate"></div><div class="caption" id="viewCaption"></div><div class="tags" id="viewTags"></div></div></article></div>
<script>
const OWNER='camchromatic',REPO='camchromatic',BRANCH='main',grid=document.getElementById('gallery'),overlay=document.getElementById('overlay'),statusLine=document.getElementById('status');let posts=[];
function normalizeCategory(raw=''){const c=String(raw).toLowerCase();if(c.includes('character'))return'character';if(c.includes('sketch')||c.includes('pathfinder'))return'sketch';return'other'}
function unquote(v=''){v=String(v).trim();if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))v=v.slice(1,-1);return v.replace(/\\n/g,'\n')}
function parseFrontMatter(text,filename){const match=text.match(/^---\s*\r?\n([\s\S]*?)\r?\n---/);if(!match)return null;const data={};for(const line of match[1].split(/\r?\n/)){const m=line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);if(m)data[m[1]]=unquote(m[2])}if(!data.title)return null;let image=data.image||'';if(image&&!/^https?:\/\//i.test(image))image=image.startsWith('/')?image:'/'+image;return{title:data.title,date:data.date||'',image,caption:data.caption||'',category:normalizeCategory(data.category||''),categoryLabel:data.category||'',tags:data.tags||'',filename}}
async function loadPosts(){try{const response=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/content/posts?ref=${BRANCH}`,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('Could not read posts');const files=await response.json();const markdownFiles=files.filter(f=>f.type==='file'&&f.name.toLowerCase().endsWith('.md'));const loaded=await Promise.all(markdownFiles.map(async f=>{const r=await fetch(f.download_url);return r.ok?parseFrontMatter(await r.text(),f.name):null}));posts=loaded.filter(p=>p&&p.image).sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(posts.length){statusLine.textContent='';document.querySelector('.filters').style.display='flex'}else{statusLine.textContent='No artwork posts yet. Add one from your Pages CMS dashboard.';document.querySelector('.filters').style.display='none'}render('all')}catch(e){statusLine.textContent='Artwork could not be loaded right now. Please refresh in a moment.';grid.innerHTML='<div class="empty">We couldn’t load the artwork. Please try refreshing this page.</div>';console.error(e)}}
function render(filter='all'){grid.innerHTML='';const visible=posts.filter(p=>filter==='all'||p.category===filter);if(!visible.length){grid.innerHTML='<div class="empty">No posts in this category yet.</div>';return}visible.forEach(p=>{const b=document.createElement('button');b.className='art-card';b.type='button';const img=document.createElement('img');img.src=p.image;img.alt=p.title;img.loading='lazy';img.onerror=()=>{b.style.display='none'};const meta=document.createElement('div');meta.className='art-meta';const title=document.createElement('p');title.className='art-title';title.textContent=p.title;const date=document.createElement('div');date.className='art-date';date.textContent=p.date;meta.append(title,date);b.append(img,meta);b.addEventListener('click',()=>openPost(p));grid.append(b)})}
function openPost(p){document.getElementById('viewImage').src=p.image;document.getElementById('viewImage').alt=p.title;document.getElementById('viewTitle').textContent=p.title;document.getElementById('viewDate').textContent=p.date;document.getElementById('viewCaption').textContent=p.caption;document.getElementById('viewTags').textContent=p.categoryLabel||p.tags||'';overlay.classList.add('open');document.body.style.overflow='hidden'}
function closePost(){overlay.classList.remove('open');document.body.style.overflow=''}
document.getElementById('close').addEventListener('click',closePost);overlay.addEventListener('click',e=>{if(e.target===overlay)closePost()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePost()});document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render(btn.dataset.filter)}));document.getElementById('year').textContent=new Date().getFullYear();document.querySelector('.filters').style.display='none';loadPosts();
</script></body></html>
