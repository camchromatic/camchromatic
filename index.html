<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamChromatic — Art Journal</title>
<style>
:root{--bg:#faf8f5;--ink:#242321;--muted:#77736f;--line:#e8e2dc;--accent:#6f5a91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line)}.top{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:1.35rem;font-weight:750;letter-spacing:-.04em;text-decoration:none}.brand span{color:var(--accent)}nav{display:flex;gap:20px;font-size:.9rem;color:var(--muted)}nav a{text-decoration:none}.hero{padding:46px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;color:var(--accent);font-weight:700}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.06em;margin:8px 0 12px}.intro{color:var(--muted);max-width:540px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}.pill{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 13px;color:var(--muted);cursor:pointer}.pill.active{background:var(--ink);color:white;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.art-card{padding:0;border:0;text-align:left;background:white;cursor:pointer;min-width:0;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px #2b20100a}.art-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee7e0}.art-meta{padding:12px 13px 15px}.art-title{font-weight:650;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.art-date{font-size:.78rem;color:var(--muted)}.empty{grid-column:1/-1;padding:52px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 0 36px;color:var(--muted);font-size:.85rem}.overlay{position:fixed;inset:0;background:#161515c9;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.open{display:flex}.post-view{background:var(--bg);width:min(940px,100%);max-height:92vh;overflow:auto;border-radius:14px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);position:relative}.post-view img{width:100%;height:100%;max-height:82vh;object-fit:contain;background:#eee7e0}.post-copy{padding:32px 26px}.close{position:absolute;right:12px;top:10px;border:0;background:white;border-radius:99px;width:36px;height:36px;font-size:1.3rem;cursor:pointer}.post-copy h2{margin:0 0 4px;font-size:1.5rem}.post-copy .date{font-size:.8rem;color:var(--muted)}.caption{white-space:pre-wrap;margin-top:22px}.tags{color:var(--accent);font-size:.85rem;margin-top:18px}@media(max-width:700px){.wrap{padding:0 14px}.hero{padding:34px 0 22px}.grid{gap:8px}.art-meta{padding:8px}.art-title{font-size:.88rem}.post-view{display:block}.post-view img{height:auto;max-height:60vh}.post-copy{padding:22px}}
</style></head><body>
<header><div class="wrap top"><a class="brand" href="#">Cam<span>Chromatic</span></a><nav><a href="#gallery">Gallery</a><a href="#about">About</a></nav></div></header>
<main class="wrap"><section class="hero" id="about"><div class="eyebrow">Art · Characters · Experiments</div><h1>A little corner<br>of color and imagination.</h1><p class="intro">A growing collection of illustrations, character art, sketches, and things I make along the way.</p></section>
<div class="filters"><button class="pill active" data-filter="all">All work</button><button class="pill" data-filter="character">Characters</button><button class="pill" data-filter="sketch">Sketches</button><button class="pill" data-filter="other">Other</button></div><section class="grid" id="gallery" aria-label="Art gallery"></section></main>
<footer><div class="wrap">© <span id="year"></span> CamChromatic · Made with care.</div></footer>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><article class="post-view"><button class="close" id="close" aria-label="Close post">×</button><img id="viewImage" alt=""><div class="post-copy"><h2 id="viewTitle"></h2><div class="date" id="viewDate"></div><div class="caption" id="viewCaption"></div><div class="tags" id="viewTags"></div></div></article></div>
<script>
const samplePosts=[
{title:"Color study",date:"Sample artwork",caption:"Your artwork will appear here once you add posts. This sample card demonstrates the layout.",category:"other",image:"https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=900&q=85",tags:"#colorstudy"},
{title:"Character notes",date:"Sample artwork",caption:"Click any artwork to open its full post with a larger image and caption.",category:"character",image:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=900&q=85",tags:"#characterart"},
{title:"Sketchbook",date:"Sample artwork",caption:"The gallery adapts to smaller screens and never exceeds three columns.",category:"sketch",image:"https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=900&q=85",tags:"#sketch"}];
let posts=[...samplePosts];const grid=document.getElementById('gallery'),overlay=document.getElementById('overlay');
function render(filter='all'){grid.innerHTML='';const visible=posts.filter(p=>filter==='all'||p.category===filter);if(!visible.length){grid.innerHTML='<div class="empty">No posts in this category yet.</div>';return;}visible.forEach(p=>{const b=document.createElement('button');b.className='art-card';b.type='button';const img=document.createElement('img');img.src=p.image;img.alt=p.title;img.loading='lazy';const meta=document.createElement('div');meta.className='art-meta';const title=document.createElement('p');title.className='art-title';title.textContent=p.title;const date=document.createElement('div');date.className='art-date';date.textContent=p.date;meta.append(title,date);b.append(img,meta);b.addEventListener('click',()=>openPost(p));grid.append(b);});}
function openPost(p){viewImage.src=p.image;viewImage.alt=p.title;viewTitle.textContent=p.title;viewDate.textContent=p.date;viewCaption.textContent=p.caption;viewTags.textContent=p.tags||'';overlay.classList.add('open');document.body.style.overflow='hidden';}
function closePost(){overlay.classList.remove('open');document.body.style.overflow='';}
document.getElementById('close').addEventListener('click',closePost);overlay.addEventListener('click',e=>{if(e.target===overlay)closePost()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePost()});document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render(btn.dataset.filter)}));document.getElementById('year').textContent=new Date().getFullYear();render();
</script></body></html>
