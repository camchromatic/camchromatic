<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamChromatic</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/themes/cyber.css?v=20261115-4">
<script src="/themes/theme.js?v=20261115-4"></script>
<style>
:root{--bg:#232628;--panel:#191b1c;--ink:#e8e2d8;--muted:#b8aa98;--line:#514536;--accent:#2785ff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1160px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line);background:var(--bg)}
.top{height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:2.1rem;font-weight:500;letter-spacing:-.04em;text-decoration:none;display:flex;gap:0}
nav{display:flex;gap:22px;font-size:.9rem}@media(max-width:700px){.top{height:auto;flex-wrap:wrap;gap:6px 0;padding:12px 0}nav{gap:10px;flex-wrap:wrap;font-size:.82rem}}nav a, nav a:visited{color:#fff}nav a[aria-current=page]{font-weight:700}nav a:hover{color:#fff;opacity:.8}a{color:var(--accent);text-decoration:none}
.hero{padding:44px 0 28px}.banner{display:block;width:100%;max-width:750px;height:auto;aspect-ratio:3/1;object-fit:cover;border-radius:12px;margin:0 0 32px;background:#191b1c}.banner.loading{visibility:hidden}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;color:var(--muted);font-weight:700}
h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.06em;margin:10px 0 12px}
.intro{color:var(--muted);max-width:540px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.updates{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.update{display:flex;gap:18px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.update time{flex:none;width:96px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.update .entry{min-width:0}.update strong{font-weight:650}.update a{color:var(--accent)}.update .text{color:var(--ink)}
.updates .empty{margin-top:14px}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:.85rem}footer .kofi{margin:6px 0 0}
@media(max-width:700px){.wrap{padding:0 14px}.hero{padding:34px 0 22px}.update{gap:12px}.update time{width:84px}}

/* Footer always in view (computers and tablets): the page itself doesn't scroll. Blog, Doodles and Projects scroll
   inside a .frame; the other pages scroll inside .scroller (its scrollbar space is kept on both sides so every page
   lines up the same). Phones scroll the whole page as usual. */
@media(min-width:761px) and (min-height:560px){
html{scrollbar-gutter:auto}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
body>header,body>footer{flex:none}
body>footer{margin-top:0;padding:14px 0 16px}
body>main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
body>main>.hero{flex:none}
.frame{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#8a949d80 transparent;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.scroller{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable both-edges;scrollbar-width:thin;scrollbar-color:#8a949d80 transparent}
.scroller>main{margin-bottom:24px}
}

/* Home layout: banner on the left, latest 3 updates on the right, then small "latest" cards */
.hero{padding:30px 0 18px}
.home-top{display:grid;grid-template-columns:minmax(0,750px) 1fr;gap:24px;align-items:start;margin-bottom:14px}
.home-top .banner{margin:0}
.side-label{margin:0 0 8px}
.side .update{flex-direction:column;gap:2px;font-size:.9rem;padding:8px 2px}
.side .update time{width:auto}
.update:nth-child(n+4){display:none}.update:nth-child(3){border-bottom:0}
.latest{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.latest-card{display:flex;gap:12px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);min-width:0}
.latest-card[hidden]{display:none}
.latest-card img{width:64px;height:44px;object-fit:cover;border-radius:6px;flex:none;background:#191b1c}
.lc-text{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}
.lc-text .eyebrow{width:100%;font-size:.66rem}
.lc-text strong{font-weight:600;font-size:.95rem}
.lc-text time{font-size:.8rem;color:var(--muted)}
.latest-card:hover strong{text-decoration:underline}
/* Updates box is exactly as tall as the banner: the banner sets the row height, the box fills it */
@media(min-width:901px){
.home-top{align-items:stretch}
.side{height:0;min-height:100%;display:flex;flex-direction:column}
.side .updates{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.side .update{flex:1;justify-content:center;font-size:.86rem;line-height:1.35;padding:6px 2px}
.side .update .entry{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.side .update time{line-height:1.3}
}
@media(max-width:900px){.home-top,.latest{grid-template-columns:1fr}}
@media(min-width:901px) and (max-height:720px){.hero{padding:16px 0 12px}.hero h1{font-size:2.6rem;margin:6px 0 4px}.side .update{padding:6px 2px}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="index.html" aria-label="CamChromatic home"><span style="color:#cc6873">c</span><span style="color:#d9765a">a</span><span style="color:#d9964d">m</span><span style="color:#cbae4e">c</span><span style="color:#b1bf5c">h</span><span style="color:#8cb866">r</span><span style="color:#6ebd94">o</span><span style="color:#6acac5">m</span><span style="color:#569ac8">a</span><span style="color:#7096c8">t</span><span style="color:#9970c1">i</span><span style="color:#c46ea8">c</span></a><nav><a href="index.html" aria-current="page">Home</a><a href="blog.html">Blog</a><a href="doodles.html">Doodles</a><a href="projects.html">Projects</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<div class="scroller"><main class="wrap">
<section class="hero"><div class="eyebrow">Here are some things made by</div><h1>Cam Garcia</h1></section><div class="home-top"><img class="banner loading" id="banner" src="media/home-banner-2026-11-04.png" alt="Drawing of Cam giving two thumbs up" width="750" height="250">
<div class="side"><div class="eyebrow side-label">Site updates</div><ul class="updates" id="updates" aria-label="Site updates" aria-live="polite"></ul></div></div>
<section class="latest" aria-label="Latest work">
<a class="latest-card" id="latestPost" href="blog.html" hidden><img alt=""><span class="lc-text"><span class="eyebrow">Latest blog post</span><strong></strong><time></time></span></a>
<a class="latest-card" id="latestDoodle" href="doodles.html" hidden><img alt="Latest doodle"><span class="lc-text"><span class="eyebrow">Latest doodle</span><strong></strong></span></a>
</section>
</main></div><footer><div class="wrap">© 2026 Cam Garcia<p class="kofi">If you like what I do, you can <a href="https://ko-fi.com/camchromatic" target="_blank" rel="noopener">support me on Ko-Fi</a>.</p></div></footer>
<script>
const OWNER='camchromatic',REPO='camchromatic',BRANCH='main';
const list=document.getElementById('updates');

function message(text){list.innerHTML='';const box=document.createElement('li');box.className='empty';box.textContent=text;list.append(box);}
function unquote(value=''){
  value=String(value).trim();
  if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))value=value.slice(1,-1);
  return value.replace(/\\n/g,'\n');
}
function parseUpdate(source,filename){
  const match=source.match(/^---\s*\r?\n([\s\S]*?)\r?\n---/);
  if(!match)return null;
  const data={},raw={};let block=null,last=null;
  for(const line of match[1].split(/\r?\n/)){
    if(block){
      if(/^\s+/.test(line)||line.trim()===''){data[block].push(line.replace(/^\s{1,2}/,''));continue;}
      data[block]=data[block].join('\n').trim();block=null;
    }
    // Pages CMS wraps long text onto indented lines; join them back up.
    if(last&&/^\s+\S/.test(line)){raw[last]+=' '+line.trim();data[last]=unquote(raw[last]);continue;}
    last=null;
    const field=line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
    if(!field)continue;
    const value=field[2].trim();
    if(['|','>','|-','>-'].includes(value)){data[field[1]]=[];block=field[1];}
    else{raw[field[1]]=value;data[field[1]]=unquote(value);last=field[1];}
  }
  if(block)data[block]=data[block].join('\n').trim();
  return data.title?{title:data.title,date:data.date||'',text:data.text||'',link:data.link||'',filename}:null;
}
function safeLink(value=''){
  // Full web addresses, or pages on this site such as projects.html or /doodles.
  value=String(value).trim();
  if(/^https?:\/\//i.test(value))return value;
  if(/^\/?[A-Za-z0-9._\/-]+(#[A-Za-z0-9_-]+)?$/.test(value)&&!value.includes('..'))return value;
  return '';
}
function bbcode(value=''){
  // Forum-style tags in update text: [b] [i] [u] [s] [color=...] [url] / [url=...].
  let html=String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const link=(href,label)=>{
    href=safeLink(href.replace(/&amp;/g,'&'));
    if(!href)return label;
    const outside=/^https?:\/\//i.test(href)?' target="_blank" rel="noopener"':'';
    return `<a href="${href.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"${outside}>${label}</a>`;
  };
  const tags=[
    [/\[b\]([\s\S]*?)\[\/b\]/gi,'<strong>$1</strong>'],
    [/\[i\]([\s\S]*?)\[\/i\]/gi,'<em>$1</em>'],
    [/\[u\]([\s\S]*?)\[\/u\]/gi,'<u>$1</u>'],
    [/\[s\]([\s\S]*?)\[\/s\]/gi,'<s>$1</s>'],
    [/\[color=(#[0-9a-f]{3,8}|[a-z]+)\]([\s\S]*?)\[\/color\]/gi,'<span style="color:$1">$2</span>'],
    [/\[url=([^\]\s]+)\]([\s\S]*?)\[\/url\]/gi,(m,href,label)=>link(href,label)],
    [/\[url\]([^\[\s]+)\[\/url\]/gi,(m,href)=>link(href,href)],
  ];
  // Repeat so tags inside other tags work too, e.g. [b][i]this[/i][/b].
  for(let before='';before!==html;){before=html;for(const [pattern,out] of tags)html=html.replace(pattern,out);}
  return html;
}
function niceDate(value){
  const parts=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!parts)return '';
  return new Date(Date.UTC(+parts[1],parts[2]-1,+parts[3])).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'});
}
function render(updates){
  updates=updates.filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.filename).localeCompare(String(a.filename)));
  if(!updates.length){message('No updates yet. Check back soon!');return;}
  list.innerHTML='';
  updates.forEach(update=>{
    // One log line: the date, then the text. (Titles are no longer shown.)
    const row=document.createElement('li');row.className='update';
    const time=document.createElement('time');time.dateTime=update.date;time.textContent=niceDate(update.date);row.append(time);
    const entry=document.createElement('span');entry.className='entry';
    const href=safeLink(update.link);
    const words=update.text?bbcode(update.text.replace(/\s*\n\s*/g,' ')):'';
    const text=document.createElement(href?'a':'span');text.className='text';
    if(href)text.href=href;
    if(words)text.innerHTML=words;else text.textContent=update.title||''; // old updates with no text keep their title
    entry.append(text);
    row.append(entry);list.append(row);
  });
}
function safeImage(value=''){
  // Pictures from this site's media folder, or full https addresses.
  value=String(value).trim();
  if(/^https:\/\//i.test(value))return value;
  if(/^\/?media\/[A-Za-z0-9._\/ -]+$/.test(value)&&!value.includes('..'))return value.startsWith('/')?value:'/'+value;
  return '';
}
async function loadBanner(ref){
  // The banner is picked in Pages CMS "Home Banner" (content/home.yml).
  const banner=document.getElementById('banner');
  try{
    const response=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${ref}/content/home.yml`);
    if(response.ok){
      const text=await response.text();
      const field=name=>{const m=text.match(new RegExp('^'+name+':[ \\t]*(.*)$','m'));return m?unquote(m[1]):'';};
      const src=safeImage(field('banner'));
      if(src&&src!==banner.getAttribute('src')){
        banner.removeAttribute('width');banner.removeAttribute('height');
        await new Promise(done=>{banner.onload=banner.onerror=done;banner.src=src;});
      }
      const alt=field('alt');if(alt)banner.alt=alt;
    }
  }catch(error){console.warn(error);}
  banner.classList.remove('loading');
}
setTimeout(()=>document.getElementById('banner').classList.remove('loading'),4000); // never hide the banner for long
async function loadUpdates(){
  message('Loading updates…');
  try{
    // Read from the newest commit itself: GitHub's file server can serve a
    // branch's files a few minutes stale right after a Pages CMS edit.
    const head=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${BRANCH}`,{headers:{Accept:'application/vnd.github.sha'}});
    const ref=head.ok?(await head.text()).trim():BRANCH;
    loadBanner(ref);loadLatest(ref);
    const response=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/content/updates?ref=${ref}`,{headers:{Accept:'application/vnd.github+json'}});
    if(response.status===404){render([]);return;} // folder appears with the first update
    if(!response.ok)throw Error('Could not read updates');
    const files=(await response.json()).filter(file=>file.type==='file'&&file.name.toLowerCase().endsWith('.md'));
    render(await Promise.all(files.map(async file=>{
      const result=await fetch(file.download_url);
      return result.ok?parseUpdate(await result.text(),file.name):null;
    })));
    list.querySelectorAll('.entry').forEach(entry=>entry.title=entry.textContent); // full text on hover if it's cut short
  }catch(error){
    message('Updates could not be loaded right now. Please refresh in a moment.');
    console.warn(error);
  }
}
// "Latest" cards: newest blog post (by its date) and newest doodle (file names are upload times).
function frontField(source,name){const m=source.match(new RegExp('^'+name+':[ \t]*(.*)$','m'));return m?unquote(m[1]):'';}
async function loadLatest(ref){
  const api=path=>fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${ref}`,{headers:{Accept:'application/vnd.github+json'}}).then(r=>r.ok?r.json():[]).catch(()=>[]);
  const [posts,doodles,doodleList]=await Promise.all([api('content/blog'),api('media/doodles'),
    fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${ref}/content/doodles.yml`).then(r=>r.ok?r.text():'').catch(()=>'')]);
  try{
    const entries=(await Promise.all((Array.isArray(posts)?posts:[]).filter(f=>f.type==='file'&&/\.md$/i.test(f.name)).map(async f=>{
      const r=await fetch(f.download_url);if(!r.ok)return null;const src=await r.text();
      const title=frontField(src,'title');return title?{title,date:frontField(src,'date'),cover:safeImage(frontField(src,'cover')),slug:f.name.replace(/\.md$/i,'')}:null;
    }))).filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const post=entries[0];
    if(post){
      const card=document.getElementById('latestPost');card.href='blog.html#'+encodeURIComponent(post.slug);
      card.querySelector('strong').textContent=post.title;card.querySelector('time').textContent=post.date?niceDate(post.date):'';
      const img=card.querySelector('img');if(post.cover)img.src=post.cover;else img.remove();
      card.hidden=false;
    }
  }catch(e){console.warn(e);}
  const hidden=new Set(doodleList.match(/[^\/'"\s]+\.png/gi)||[]);
  const doodle=(Array.isArray(doodles)?doodles:[]).filter(f=>f.type==='file'&&/\.png$/i.test(f.name)&&!hidden.has(f.name)).sort((a,b)=>b.name.localeCompare(a.name))[0];
  if(doodle){
    const card=document.getElementById('latestDoodle');card.querySelector('img').src=doodle.download_url;
    const d=doodle.name.match(/^(\d{4}-\d{2}-\d{2})/);card.querySelector('strong').textContent=d?niceDate(d[1]):'New doodle';
    card.hidden=false;
  }
}
loadUpdates();
</script><script src="/no-right-click.js"></script>
</body></html>
