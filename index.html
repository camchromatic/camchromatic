<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art by Cam Garcia</title>
<style>
:root{--bg:#232628;--panel:#191b1c;--ink:#e8e2d8;--muted:#b8aa98;--line:#514536;--accent:#2785ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1160px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line)}
.top{height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:1.25rem;font-weight:500;letter-spacing:-.04em;text-decoration:none;display:flex;gap:0}
nav{display:flex;gap:22px;font-size:.9rem}a{color:var(--accent);text-decoration:none}
.hero{padding:44px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;color:var(--muted);font-weight:700}
h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.06em;margin:10px 0 12px}
.intro{color:var(--muted);max-width:540px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.art-card{padding:0;border:0;text-align:left;background:var(--panel);color:var(--ink);cursor:pointer;min-width:0;border-radius:10px;overflow:hidden}
.art-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#39332a}
.empty{grid-column:1/-1;padding:52px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.status{font-size:.84rem;color:var(--muted);margin:12px 0 18px}
footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 0 36px;color:var(--muted);font-size:.85rem}
.overlay{position:fixed;inset:0;background:#080808d9;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.open{display:flex}
.post-view{background:var(--bg);width:min(940px,100%);max-height:92vh;overflow:auto;border-radius:14px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);position:relative}
.post-images{min-width:0;display:flex;flex-direction:column;gap:10px;max-height:82vh;overflow-y:auto;background:#181818}
.post-images img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#181818}
.post-copy{padding:32px 26px;overflow-y:auto}
.close{position:absolute;right:12px;top:10px;border:0;background:#eee;color:#222;border-radius:99px;width:36px;height:36px;font-size:1.3rem;cursor:pointer;z-index:2}
.caption{white-space:pre-wrap;margin-top:0}
@media(max-width:700px){.wrap{padding:0 14px}.hero{padding:34px 0 22px}.grid{gap:8px}.post-view{display:block}.post-images{max-height:60vh}.post-images img{max-height:60vh}.post-copy{padding:22px}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="index.html" aria-label="CamChromatic home"><span style="color:#cc6873">c</span><span style="color:#d9765a">a</span><span style="color:#d9964d">m</span><span style="color:#cbae4e">c</span><span style="color:#b1bf5c">h</span><span style="color:#8cb866">r</span><span style="color:#6ebd94">o</span><span style="color:#6acac5">m</span><span style="color:#569ac8">a</span><span style="color:#7096c8">t</span><span style="color:#9970c1">i</span><span style="color:#c46ea8">c</span></a><nav><a href="#gallery">Gallery</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<main class="wrap">
<section class="hero" id="about"><div class="eyebrow">Digital & Traditional · Characters & Explorations · Jewellery & Crafts</div><h1>Creations by Cam Garcia</h1><p class="intro">Available for hire.</p></section>
<div class="status" id="status" aria-live="polite">Loading artwork…</div><section class="grid" id="gallery" aria-label="Art gallery"></section>
</main><footer><div class="wrap">© 2020-<span id="year"></span> CamChromatic · Webside code made with minimal AI assistance.</div></footer>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Artwork details"><article class="post-view"><button class="close" id="close" aria-label="Close post">×</button><div id="viewImages" class="post-images"></div><div class="post-copy"><div class="caption" id="viewCaption"></div></div></article></div>
<script>
const OWNER='camchromatic',REPO='camchromatic',BRANCH='main';
const grid=document.getElementById('gallery');
const overlay=document.getElementById('overlay');
const statusLine=document.getElementById('status');
let posts=[];

function unquote(value=''){
  value=String(value).trim();
  if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))value=value.slice(1,-1);
  return value.replace(/\\n/g,'\n');
}
function imagePath(value){
  const path=unquote(value);
  if(!path)return '';
  if(/^https?:\/\//i.test(path))return path;
  return path.startsWith('/')?path:'/'+path;
}
function parseFrontMatter(text,filename){
  const match=text.match(/^---\s*\r?\n([\s\S]*?)\r?\n---/);
  if(!match)return null;
  const data={},lines=match[1].split(/\r?\n/);
  let activeArray=null,activeBlock=null;
  for(const line of lines){
    if(activeBlock){
      if(/^\s+/.test(line)||line.trim()===''){data[activeBlock].push(line.replace(/^\s{1,2}/,''));continue;}
      data[activeBlock]=data[activeBlock].join('\n').replace(/\n+$/,'');activeBlock=null;
    }
    const item=line.match(/^\s+-\s*(.*?)\s*$/);
    if(item&&activeArray){data[activeArray].push(unquote(item[1]));continue;}
    const field=line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
    if(!field){activeArray=null;continue;}
    const key=field[1],value=field[2].trim();
    if(key==='images'){
      activeArray='images';
      if(value.startsWith('[')){
        try{data.images=JSON.parse(value.replace(/'/g,'"'));}
        catch{data.images=value.replace(/^\[|\]$/g,'').split(',').map(unquote).filter(Boolean);}
      }else data.images=[];
    }else if(key==='caption'&&['|','>','|-','>-'].includes(value)){
      data.caption=[];activeBlock='caption';activeArray=null;
    }else{data[key]=unquote(value);activeArray=null;}
  }
  if(activeBlock)data[activeBlock]=data[activeBlock].join('\n').replace(/\n+$/,'');
  let images=Array.isArray(data.images)?data.images:[];
  if(!images.length&&data.image)images=[data.image];
  images=images.map(imagePath).filter(Boolean);
  return images.length?{images,caption:data.caption||'',filename}:null;
}
async function loadPosts(){
  try{
    const response=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/content/posts?ref=${BRANCH}`,{headers:{Accept:'application/vnd.github+json'}});
    if(!response.ok)throw Error('Could not read posts');
    const files=await response.json();
    const markdownFiles=files.filter(file=>file.type==='file'&&file.name.toLowerCase().endsWith('.md'));
    const loaded=await Promise.all(markdownFiles.map(async file=>{
      const result=await fetch(file.download_url);
      return result.ok?parseFrontMatter(await result.text(),file.name):null;
    }));
    posts=loaded.filter(Boolean);
    statusLine.textContent=posts.length?'':'No artwork posts yet. Add one from your Pages CMS dashboard.';
    render();
  }catch(error){
    statusLine.textContent='Artwork could not be loaded right now. Please refresh in a moment.';
    grid.innerHTML='<div class="empty">We couldn’t load the artwork. Please try refreshing this page.</div>';
    console.error(error);
  }
}
function render(){
  grid.innerHTML='';
  if(!posts.length){grid.innerHTML='<div class="empty">No artwork posts yet.</div>';return;}
  posts.forEach(post=>{
    const card=document.createElement('button');card.className='art-card';card.type='button';
    const image=document.createElement('img');image.src=post.images[0];image.alt=post.caption||'Artwork';image.loading='lazy';
    image.onerror=()=>{card.style.display='none';};
    card.append(image);card.addEventListener('click',()=>openPost(post));grid.append(card);
  });
}
function openPost(post){
  const container=document.getElementById('viewImages');container.innerHTML='';
  post.images.forEach((src,index)=>{
    const image=document.createElement('img');image.src=src;image.alt=`Artwork image ${index+1}`;image.loading=index===0?'eager':'lazy';container.append(image);
  });
  document.getElementById('viewCaption').textContent=post.caption;
  overlay.classList.add('open');document.body.style.overflow='hidden';
}
function closePost(){overlay.classList.remove('open');document.body.style.overflow='';}
document.getElementById('close').addEventListener('click',closePost);
overlay.addEventListener('click',event=>{if(event.target===overlay)closePost();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closePost();});
document.getElementById('year').textContent=new Date().getFullYear();
loadPosts();
</script></body></html>
