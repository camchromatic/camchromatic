<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamChromatic</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#232628;--panel:#191b1c;--ink:#e8e2d8;--muted:#b8aa98;--line:#514536;--accent:#2785ff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1160px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line);background:var(--bg)}
.top{height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:2.1rem;font-weight:500;letter-spacing:-.04em;text-decoration:none;display:flex;gap:0}
nav{display:flex;gap:22px;font-size:.9rem}@media(max-width:700px){.top{height:auto;flex-wrap:wrap;gap:6px 0;padding:12px 0}nav{gap:10px;flex-wrap:wrap;font-size:.82rem}}nav a, nav a:visited{color:#fff}nav a[aria-current=page]{font-weight:700}nav a:hover{color:#fff;opacity:.8}a{color:var(--accent);text-decoration:none}
.hero{padding:44px 0 28px}.banner{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:cover;border-radius:12px;margin:0 0 32px;background:#191b1c}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;color:var(--muted);font-weight:700}
h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.06em;margin:10px 0 12px}
.intro{color:var(--muted);max-width:540px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.updates{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.update{display:flex;gap:18px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.update time{flex:none;width:96px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.update .entry{min-width:0}.update strong{font-weight:650}.update a{color:var(--accent)}.update .text{color:var(--muted)}
.updates .empty{margin-top:14px}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:.85rem}footer .kofi{margin:6px 0 0}
@media(max-width:700px){.wrap{padding:0 14px}.hero{padding:34px 0 22px}.update{gap:12px}.update time{width:84px}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="index.html" aria-label="CamChromatic home"><span style="color:#cc6873">c</span><span style="color:#d9765a">a</span><span style="color:#d9964d">m</span><span style="color:#cbae4e">c</span><span style="color:#b1bf5c">h</span><span style="color:#8cb866">r</span><span style="color:#6ebd94">o</span><span style="color:#6acac5">m</span><span style="color:#569ac8">a</span><span style="color:#7096c8">t</span><span style="color:#9970c1">i</span><span style="color:#c46ea8">c</span></a><nav><a href="index.html" aria-current="page">Home</a><a href="blog.html">Blog</a><a href="doodles.html">Doodles</a><a href="projects.html">Projects</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">Here are some things made by</div><h1>Cam Garcia</h1><p class="intro">Based in South Florida, available for work.</p></section><img class="banner" src="media/home-banner-2026-11-04.png" alt="Drawing of Cam giving two thumbs up" width="750" height="250">
<ul class="updates" id="updates" aria-label="Site updates" aria-live="polite"></ul>
</main><footer><div class="wrap">© 2026 Cam Garcia<p class="kofi">If you like what I do, you can <a href="https://ko-fi.com/camchromatic" target="_blank" rel="noopener">support me on Ko-Fi</a>.</p></div></footer>
<script>
const OWNER='camchromatic',REPO='camchromatic',BRANCH='main';
const list=document.getElementById('updates');

function message(text){list.innerHTML='';const box=document.createElement('li');box.className='empty';box.textContent=text;list.append(box);}
function unquote(value=''){
  value=String(value).trim();
  if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))value=value.slice(1,-1);
  return value.replace(/\\n/g,'\n');
}
function parseUpdate(source,filename){
  const match=source.match(/^---\s*\r?\n([\s\S]*?)\r?\n---/);
  if(!match)return null;
  const data={},raw={};let block=null,last=null;
  for(const line of match[1].split(/\r?\n/)){
    if(block){
      if(/^\s+/.test(line)||line.trim()===''){data[block].push(line.replace(/^\s{1,2}/,''));continue;}
      data[block]=data[block].join('\n').trim();block=null;
    }
    // Pages CMS wraps long text onto indented lines; join them back up.
    if(last&&/^\s+\S/.test(line)){raw[last]+=' '+line.trim();data[last]=unquote(raw[last]);continue;}
    last=null;
    const field=line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
    if(!field)continue;
    const value=field[2].trim();
    if(['|','>','|-','>-'].includes(value)){data[field[1]]=[];block=field[1];}
    else{raw[field[1]]=value;data[field[1]]=unquote(value);last=field[1];}
  }
  if(block)data[block]=data[block].join('\n').trim();
  return data.title?{title:data.title,date:data.date||'',text:data.text||'',link:data.link||'',filename}:null;
}
function safeLink(value=''){
  // Full web addresses, or pages on this site such as projects.html or /doodles.
  value=String(value).trim();
  if(/^https?:\/\//i.test(value))return value;
  if(/^\/?[A-Za-z0-9._\/-]+(#[A-Za-z0-9_-]+)?$/.test(value)&&!value.includes('..'))return value;
  return '';
}
function bbcode(value=''){
  // Forum-style tags in update text: [b] [i] [u] [s] [color=...] [url] / [url=...].
  let html=String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const link=(href,label)=>{
    href=safeLink(href.replace(/&amp;/g,'&'));
    if(!href)return label;
    const outside=/^https?:\/\//i.test(href)?' target="_blank" rel="noopener"':'';
    return `<a href="${href.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"${outside}>${label}</a>`;
  };
  const tags=[
    [/\[b\]([\s\S]*?)\[\/b\]/gi,'<strong>$1</strong>'],
    [/\[i\]([\s\S]*?)\[\/i\]/gi,'<em>$1</em>'],
    [/\[u\]([\s\S]*?)\[\/u\]/gi,'<u>$1</u>'],
    [/\[s\]([\s\S]*?)\[\/s\]/gi,'<s>$1</s>'],
    [/\[color=(#[0-9a-f]{3,8}|[a-z]+)\]([\s\S]*?)\[\/color\]/gi,'<span style="color:$1">$2</span>'],
    [/\[url=([^\]\s]+)\]([\s\S]*?)\[\/url\]/gi,(m,href,label)=>link(href,label)],
    [/\[url\]([^\[\s]+)\[\/url\]/gi,(m,href)=>link(href,href)],
  ];
  // Repeat so tags inside other tags work too, e.g. [b][i]this[/i][/b].
  for(let before='';before!==html;){before=html;for(const [pattern,out] of tags)html=html.replace(pattern,out);}
  return html;
}
function niceDate(value){
  const parts=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!parts)return '';
  return new Date(Date.UTC(+parts[1],parts[2]-1,+parts[3])).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'});
}
function render(updates){
  updates=updates.filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.filename).localeCompare(String(a.filename)));
  if(!updates.length){message('No updates yet. Check back soon!');return;}
  list.innerHTML='';
  updates.forEach(update=>{
    // One log line: date, then the title (a link when there is one) and the text.
    const row=document.createElement('li');row.className='update';
    const time=document.createElement('time');time.dateTime=update.date;time.textContent=niceDate(update.date);row.append(time);
    const entry=document.createElement('span');entry.className='entry';
    const href=safeLink(update.link);
    const title=document.createElement(href?'a':'strong');title.textContent=update.title;
    if(href){title.href=href;title.style.fontWeight='650';}
    entry.append(title);
    if(update.text){const text=document.createElement('span');text.className='text';text.innerHTML=' — '+bbcode(update.text.replace(/\s*\n\s*/g,' '));entry.append(text);}
    row.append(entry);list.append(row);
  });
}
async function loadUpdates(){
  message('Loading updates…');
  try{
    // Read from the newest commit itself: GitHub's file server can serve a
    // branch's files a few minutes stale right after a Pages CMS edit.
    const head=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${BRANCH}`,{headers:{Accept:'application/vnd.github.sha'}});
    const ref=head.ok?(await head.text()).trim():BRANCH;
    const response=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/content/updates?ref=${ref}`,{headers:{Accept:'application/vnd.github+json'}});
    if(response.status===404){render([]);return;} // folder appears with the first update
    if(!response.ok)throw Error('Could not read updates');
    const files=(await response.json()).filter(file=>file.type==='file'&&file.name.toLowerCase().endsWith('.md'));
    render(await Promise.all(files.map(async file=>{
      const result=await fetch(file.download_url);
      return result.ok?parseUpdate(await result.text(),file.name):null;
    })));
  }catch(error){
    message('Updates could not be loaded right now. Please refresh in a moment.');
    console.warn(error);
  }
}
loadUpdates();
</script><script src="/no-right-click.js"></script>
</body></html>
