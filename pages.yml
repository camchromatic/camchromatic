media:
  input: media
  output: /media
  categories: [image]

content:
  - name: posts
    label: Art Posts
    type: collection
    path: content/posts
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: images
        label: Images
        type: image
        required: true
        options:
          multiple:
            max: 10
          unique: true
      - name: caption
        label: Caption
        type: text

  - name: blog
    label: Blog Entries
    type: collection
    path: content/blog
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: cover
        label: Cover Image
        type: image
      - name: cover_position
        label: Preview Crop Position
        type: select
        description: Choose which part of the cover stays visible in the square blog preview. The full article keeps the original image.
        options:
          values:
            - name: top-left
              label: Top left
            - name: top-center
              label: Top centre
            - name: top-right
              label: Top right
            - name: middle-left
              label: Middle left
            - name: center
              label: Centre
            - name: middle-right
              label: Middle right
            - name: bottom-left
              label: Bottom left
            - name: bottom-center
              label: Bottom centre
            - name: bottom-right
              label: Bottom right
      - name: body
        label: Entry
        type: rich-text
        options:
          format: markdown
